<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ödev Teslim</title>
<style>
  :root { --bg:#f2f5f9; --ink:#14213d; --muted:#5b667a; --line:#cfd8e3; --accent:#0b6e4f; --err:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1622; --ink:#e8edf5; --muted:#9aa7bb; --line:#2a3548; --accent:#3fbf94; --err:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width:520px; margin:0 auto; padding:32px 20px 48px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  .alt { color:var(--muted); margin:0 0 24px; }
  label { display:block; font-weight:600; margin:18px 0 6px; }
  input, select { width:100%; padding:12px; font:inherit; color:inherit; background:transparent; border:2px solid var(--line); border-radius:6px; }
  input:focus, select:focus, button:focus-visible { outline:3px solid var(--accent); outline-offset:1px; }
  .aciklama { color:var(--muted); font-size:.95rem; margin:6px 0 0; min-height:1.4em; }
  button { margin-top:26px; width:100%; padding:14px; font:inherit; font-weight:700; color:#fff; background:var(--accent); border:0; border-radius:6px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #mesaj { margin-top:18px; padding:12px; border-radius:6px; display:none; border:2px solid; }
  #mesaj.ok { display:block; border-color:var(--accent); }
  #mesaj.hata { display:block; border-color:var(--err); color:var(--err); }
</style>
</head>
<body>
<main>
  <h1>Ödev teslim</h1>
  <p class="alt">Okul numaranı yaz, ödevi seç, dosyanı yükle.</p>

  <label for="no">Okul numarası</label>
  <input id="no" inputmode="numeric" autocomplete="off">

  <label for="konu">Ödev</label>
  <select id="konu"><option value="">Yükleniyor…</option></select>
  <p class="aciklama" id="aciklama"></p>

  <label for="dosya">Dosya (en fazla 10 MB)</label>
  <input id="dosya" type="file">

  <button id="gonder">Ödevi gönder</button>
  <div id="mesaj" role="status"></div>
</main>

<script>
  // Apps Script "Web uygulaması olarak dağıt" adımından aldığınız adresi yapıştırın:
  const API = 'https://script.google.com/macros/s/AKfycbx2tU8F_7vkzg19DiHchPcs7w1eGadO4JkCmN-I39HYZBTNuGR9eWh9mmjuAqX8V_ziHA/exec';
  const MAX = 10 * 1024 * 1024;
  const $ = id => document.getElementById(id);
  let odevler = [];

  function mesaj(metin, tur) { const m = $('mesaj'); m.textContent = metin; m.className = tur; }

  fetch(API).then(r => r.json()).then(d => {
    odevler = d.odevler;
    $('konu').innerHTML = odevler.length
      ? '<option value="">Ödev seç</option>' + odevler.map(o => `<option>${o.konu}</option>`).join('')
      : '<option value="">Şu an teslime açık ödev yok</option>';
  }).catch(() => mesaj('Ödev listesi yüklenemedi. Sayfayı yenile.', 'hata'));

  $('konu').onchange = () => {
    const o = odevler.find(x => x.konu === $('konu').value);
    $('aciklama').textContent = o ? `${o.aciklama} Son teslim: ${o.son}` : '';
  };

  $('gonder').onclick = async () => {
    const no = $('no').value.trim(), konu = $('konu').value, f = $('dosya').files[0];
    if (!no || !konu || !f) return mesaj('Numara, ödev ve dosya seçilmeli.', 'hata');
    if (f.size > MAX) return mesaj('Dosya 10 MB\'ı geçiyor.', 'hata');

    $('gonder').disabled = true; mesaj('Yükleniyor…', 'ok');
    try {
      const veri = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result.split(',')[1]);
        r.onerror = rej;
        r.readAsDataURL(f);
      });
      const yanit = await fetch(API, { method: 'POST', body: JSON.stringify({ no, konu, dosyaAdi: f.name, tip: f.type, veri }) });
      const s = await yanit.json();
      if (s.ok) { mesaj(`Teslim alındı: ${s.ad}. Aynı ödevi tekrar yüklersen eskisi değişir.`, 'ok'); $('dosya').value = ''; }
      else mesaj(s.hata, 'hata');
    } catch (e) {
      mesaj('Gönderilemedi. Bağlantını kontrol edip tekrar dene.', 'hata');
    }
    $('gonder').disabled = false;
  };
</script>
</body>
</html>
